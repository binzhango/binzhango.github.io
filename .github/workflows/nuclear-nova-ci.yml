name: Nuclear Nova CI

on:
  push:
    paths:
      - 'nuclear-nova/**'
      - '.github/workflows/nuclear-nova-ci.yml'
  pull_request:
    paths:
      - 'nuclear-nova/**'
      - '.github/workflows/nuclear-nova-ci.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nuclear-nova-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuclear-nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nuclear-nova/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run Astro checks and build
        run: npx astro check && npm run build

  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/binzhango-server'
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: nuclear-nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nuclear-nova/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages site
        run: npm run build
        env:
          SITE_URL: https://binzhango.github.io

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nuclear-nova/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
