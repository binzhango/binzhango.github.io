<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f7f2e8;
      }

      body {
        color: #172033;
        font-family: "JetBrains Mono", monospace;
      }

      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        background:
          radial-gradient(circle at 14% 12%, rgba(56, 189, 248, 0.15), transparent 24%),
          radial-gradient(circle at 88% 90%, rgba(250, 204, 21, 0.17), transparent 26%),
          linear-gradient(180deg, #fbf7ed 0%, #eee7da 100%);
      }

      .caption {
        position: absolute;
        top: 34px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 31px;
        font-weight: 850;
        letter-spacing: 0.02em;
      }

      .pipeline {
        position: absolute;
        left: 86px;
        top: 104px;
        width: 720px;
      }

      .step {
        position: relative;
        height: 68px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        padding: 0 26px;
        border: 3px solid #1f2937;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 14px 32px rgba(31, 41, 55, 0.1);
        font-size: 22px;
        font-weight: 780;
      }

      .step::after {
        content: "";
        position: absolute;
        left: 48px;
        bottom: -25px;
        width: 4px;
        height: 25px;
        background: #334155;
      }

      .step:last-child::after {
        display: none;
      }

      .step-number {
        width: 36px;
        height: 36px;
        margin-right: 18px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 18px;
        font-weight: 900;
      }

      .kv-panel {
        position: absolute;
        right: 78px;
        top: 168px;
        width: 340px;
        height: 302px;
        padding: 28px 30px;
        border: 3px solid #1f2937;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
      }

      .kv-title {
        margin-bottom: 22px;
        text-align: center;
        font-size: 28px;
        font-weight: 850;
      }

      .tier {
        height: 42px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border: 2px solid #334155;
        background: #eff6ff;
        font-size: 19px;
        font-weight: 800;
      }

      .actions {
        position: absolute;
        right: 78px;
        bottom: 82px;
        width: 340px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .action {
        height: 44px;
        display: grid;
        place-items: center;
        border: 2px solid #334155;
        background: #fef3c7;
        font-size: 17px;
        font-weight: 850;
      }

      .link-line {
        position: absolute;
        left: 806px;
        top: 278px;
        width: 158px;
        height: 4px;
        background: #334155;
        transform-origin: left center;
      }

      .link-head {
        position: absolute;
        left: 956px;
        top: 267px;
        width: 0;
        height: 0;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
        border-left: 18px solid #334155;
      }

      .packet {
        position: absolute;
        left: 110px;
        top: 125px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #2563eb;
        box-shadow: 0 0 0 9px rgba(37, 99, 235, 0.13);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1280"
      data-height="720"
    >
      <div id="caption" class="caption">NEWER KV-CENTRIC SERVING STACK</div>

      <div class="pipeline">
        <div id="step1" class="step"><span class="step-number">1</span>request</div>
        <div id="step2" class="step"><span class="step-number">2</span>router / scheduler</div>
        <div id="step3" class="step"><span class="step-number">3</span>can we reuse an existing KV prefix?</div>
        <div id="step4" class="step"><span class="step-number">4</span>where is that KV stored?</div>
        <div id="step5" class="step"><span class="step-number">5</span>prefill, transfer, fetch, evict, or decode?</div>
        <div id="step6" class="step"><span class="step-number">6</span>response</div>
      </div>

      <div id="link-line" class="link-line"></div>
      <div id="link-head" class="link-head"></div>

      <aside id="kv-panel" class="kv-panel">
        <div class="kv-title">KV CACHE STATE</div>
        <div class="tier">L1 <span>GPU HBM</span></div>
        <div class="tier">L2 <span>CPU DRAM</span></div>
        <div class="tier">L3 <span>local SSD</span></div>
        <div class="tier">L4 <span>remote store</span></div>
      </aside>

      <div id="actions" class="actions">
        <div class="action">prefill</div>
        <div class="action">transfer</div>
        <div class="action">fetch</div>
        <div class="action">evict</div>
        <div class="action">decode</div>
        <div class="action">reuse</div>
      </div>

      <div id="packet" class="packet"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      tl.set([
        "#step1",
        "#step2",
        "#step3",
        "#step4",
        "#step5",
        "#step6",
        "#kv-panel",
        "#actions",
        "#link-line",
        "#link-head",
        "#packet",
      ], { opacity: 0 });

      tl.fromTo("#step1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 0.1);
      tl.fromTo("#step2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 0.52);
      tl.fromTo("#step3", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 0.94);
      tl.fromTo("#link-line", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3 }, 1.12);
      tl.fromTo("#link-head", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.18 }, 1.32);
      tl.fromTo("#kv-panel", { opacity: 0, x: 24, scale: 0.98 }, { opacity: 1, x: 0, scale: 1, duration: 0.38 }, 1.42);
      tl.fromTo("#step4", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 1.85);
      tl.fromTo("#step5", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 2.28);
      tl.fromTo("#actions", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35 }, 2.55);
      tl.fromTo("#step6", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.28 }, 3.05);
      tl.fromTo("#packet", { opacity: 0, y: 0, scale: 0.7 }, { opacity: 1, y: 450, scale: 1, duration: 2.8 }, 0.45);
      tl.to("#packet", { opacity: 0, scale: 0.5, duration: 0.2 }, 3.35);
      tl.to(["#kv-panel", "#actions"], { scale: 1.01, duration: 0.22, yoyo: true, repeat: 1 }, 3.65);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
