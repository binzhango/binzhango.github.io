<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f7f2e8;
      }

      body {
        color: #172033;
        font-family: "JetBrains Mono", monospace;
      }

      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        background:
          radial-gradient(circle at 12% 16%, rgba(56, 189, 248, 0.14), transparent 25%),
          radial-gradient(circle at 88% 84%, rgba(250, 204, 21, 0.16), transparent 25%),
          linear-gradient(180deg, #fbf7ed 0%, #eee7da 100%);
      }

      .caption {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .node {
        position: absolute;
        top: 270px;
        width: 260px;
        height: 138px;
        display: grid;
        place-content: center;
        border: 3px solid #1f2937;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
        text-align: center;
      }

      .request {
        left: 110px;
      }

      .gpu {
        left: 510px;
      }

      .response {
        left: 910px;
      }

      .node-title {
        font-size: 34px;
        font-weight: 850;
      }

      .node-subtitle {
        margin-top: 10px;
        font-size: 19px;
        font-weight: 650;
        color: #334155;
      }

      .arrow {
        position: absolute;
        top: 338px;
        width: 122px;
        height: 4px;
        background: #334155;
        transform-origin: left center;
      }

      .arrow-one {
        left: 374px;
      }

      .arrow-two {
        left: 774px;
      }

      .arrow-head {
        position: absolute;
        top: 327px;
        width: 0;
        height: 0;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
        border-left: 18px solid #334155;
      }

      .head-one {
        left: 492px;
      }

      .head-two {
        left: 892px;
      }

      .packet {
        position: absolute;
        top: 322px;
        left: 130px;
        width: 36px;
        height: 36px;
        border: 3px solid #1d4ed8;
        border-radius: 999px;
        background: #bfdbfe;
        box-shadow: 0 0 0 11px rgba(37, 99, 235, 0.12);
      }

      .note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 96px;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1280"
      data-height="720"
    >
      <div id="caption" class="caption">OLD MENTAL MODEL</div>

      <section id="request" class="node request">
        <div class="node-title">REQUEST</div>
        <div class="node-subtitle">prompt comes in</div>
      </section>

      <div id="arrow-one" class="arrow arrow-one"></div>
      <div id="head-one" class="arrow-head head-one"></div>

      <section id="gpu" class="node gpu">
        <div class="node-title">GPU</div>
        <div class="node-subtitle">run the model</div>
      </section>

      <div id="arrow-two" class="arrow arrow-two"></div>
      <div id="head-two" class="arrow-head head-two"></div>

      <section id="response" class="node response">
        <div class="node-title">RESPONSE</div>
        <div class="node-subtitle">tokens come out</div>
      </section>

      <div id="packet" class="packet"></div>
      <div id="note" class="note">Simple linear path: request -&gt; GPU -&gt; response</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      tl.set(["#request", "#gpu", "#response", "#arrow-one", "#arrow-two", "#head-one", "#head-two", "#packet", "#note"], {
        opacity: 0,
      });
      tl.fromTo("#request", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35 }, 0.1);
      tl.fromTo("#arrow-one", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35 }, 0.55);
      tl.fromTo("#head-one", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.18 }, 0.82);
      tl.fromTo("#gpu", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35 }, 0.95);
      tl.fromTo("#arrow-two", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35 }, 1.32);
      tl.fromTo("#head-two", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.18 }, 1.58);
      tl.fromTo("#response", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35 }, 1.72);
      tl.fromTo("#packet", { opacity: 0, x: 0, scale: 0.7 }, { opacity: 1, x: 1010, scale: 1, duration: 1.75 }, 0.6);
      tl.to("#packet", { opacity: 0, scale: 0.65, duration: 0.2 }, 2.42);
      tl.fromTo("#note", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35 }, 2.45);
      tl.to(["#request", "#gpu", "#response"], { scale: 1.006, duration: 0.2, yoyo: true, repeat: 1 }, 3.15);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
