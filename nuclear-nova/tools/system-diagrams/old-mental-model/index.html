<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#050912;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui;color:#eef5ff}svg{display:block}.title{font-size:38px;font-weight:650;letter-spacing:-.02em;fill:#eef5ff}.subtitle{font-size:21px;fill:#7f8ba3}.group-label,.kicker,.chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.12em}.group-label{font-size:16px}.kicker{font-size:16px}.node-title{font-size:27px;font-weight:650;fill:#eef5ff}.detail{font-size:17px;fill:#8490a6}.edge{fill:none;stroke-width:1.5}.packet{filter:url(#glow)}
</style></head><body><svg id="stage"></svg><script type="module">
const scene=window.__SCENE__ || await fetch('./scene.json').then(r=>r.json());
const {width:W,height:H,duration}=scene.canvas;const svg=document.querySelector('#stage');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);
const C={blue:'#3188ff',violet:'#8b5cf6',green:'#00c889',neutral:'#637087'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grid=`<defs><pattern id="grid" width="92" height="92" patternUnits="userSpaceOnUse"><path d="M92 0H0V92" fill="none" stroke="#8fb6e8" stroke-opacity=".045"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="#050912"/><rect width="100%" height="100%" fill="url(#grid)"/>`;
const groups=(scene.groups||[]).map(g=>{const c=C[g.accent||'neutral'];return `<g><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="26" fill="${c}" fill-opacity=".025" stroke="${c}" stroke-opacity=".3" ${g.dashed?'stroke-dasharray="6 7"':''}/><rect x="${g.x+30}" y="${g.y-18}" width="${Math.max(170,g.label.length*11+42)}" height="36" rx="18" fill="#050912" stroke="${c}" stroke-opacity=".45"/><text x="${g.x+50}" y="${g.y+6}" class="group-label" fill="${c}">${esc(g.label)}</text></g>`}).join('');
const byId=Object.fromEntries(scene.nodes.map(n=>[n.id,n]));
const edges=(scene.edges||[]).map((e,i)=>{const a=byId[e.from],b=byId[e.to],c=C[e.accent||'neutral'];const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;const vertical=Math.abs(y2-y1)>100;const d=vertical?`M${a.x+a.w/2},${a.y+a.h} C${a.x+a.w/2},${(a.y+a.h+b.y)/2} ${b.x+b.w/2},${(a.y+a.h+b.y)/2} ${b.x+b.w/2},${b.y}`:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;return `<g><path id="edge-${i}" d="${d}" class="edge" stroke="${c}" stroke-opacity=".35"/><circle class="packet" r="5" fill="${c}"><animateMotion dur="${scene.packetDuration||duration}s" repeatCount="indefinite" begin="${i*.42}s" path="${d}"/></circle></g>`}).join('');
const nodes=scene.nodes.map((n,i)=>{const c=C[n.accent||'neutral'];return `<g class="node" data-id="${esc(n.id)}" data-index="${i}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="20" fill="${c}" fill-opacity=".075" stroke="${c}" stroke-opacity=".44"/><rect class="halo" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="20" fill="none" stroke="${c}" stroke-width="2" opacity="0" filter="url(#glow)"/><text x="${n.x+32}" y="${n.y+40}" class="kicker" fill="${c}">${esc(n.kicker)}</text><text x="${n.x+32}" y="${n.y+82}" class="node-title">${esc(n.title)}</text><text x="${n.x+32}" y="${n.y+115}" class="detail">${esc(n.detail)}</text></g>`}).join('');
const chips=(scene.chips||[]).map(ch=>{const c=C[ch.accent||'neutral'],w=Math.max(138,ch.label.length*11+42);return `<g><rect x="${ch.x}" y="${ch.y}" width="${w}" height="48" rx="24" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".38"/><text x="${ch.x+22}" y="${ch.y+30}" class="chip" font-size="14" fill="${c}">${esc(ch.label)}</text></g>`}).join('');
svg.innerHTML=grid+`<text x="80" y="90" class="title">${esc(scene.title)}</text><text x="80" y="128" class="subtitle">${esc(scene.subtitle)}</text>`+groups+edges+nodes+chips;
const params=new URLSearchParams(location.search);const frame=Number(params.get('frame')||0),fps=scene.canvas.fps,t=(frame/fps)%duration,seq=scene.sequence||scene.nodes.map(n=>n.id),slot=duration/seq.length,phase=t/slot,active=seq[Math.floor(phase)%seq.length],local=phase-Math.floor(phase),pulse=Math.sin(Math.PI*local)**2;
document.querySelectorAll('.node').forEach(g=>{const on=g.dataset.id===active;g.querySelector('.halo').setAttribute('opacity',on?String(.22+.68*pulse):'0');g.style.opacity=on?String(.78+.22*pulse):'.58'});document.querySelectorAll('animateMotion').forEach(a=>a.setAttribute('begin','0s'));svg.setCurrentTime(t);window.__READY__=true;
</script></body></html>
